  .tools { display: flex; gap: 6px; margin-top: 8px; }
  .tools button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);

  .tools .count { margin-left: auto; font-size: 13px; color: var(--sub); align-self: center; }

  .ctx.red { color: #c0392b; font-weight: 700; }
  .ctx.sea { color: #6d93b3; font-style: italic; }
  .pin { position: absolute; transform: translate(-50%, -50%); border: none; padding: 0; cursor: pointer;

  .pin .mk { position: absolute; inset: 15%; display: grid; place-items: center; border-radius: 5px;

  .pin.country .mk { border-radius: 50%; background: #222; color: #fff; border-color: #222; }
  .pin.city .mk { border-radius: 50%; }

  .pin.open .mk { background: #d62828; border-color: #d62828; color: #fff; }

    white-space: nowrap; background: rgba(214, 40, 40, .95); color: #fff; z-index: 2;
    font-size: clamp(10px, 2vw, 15px); font-weight: 700; padding: 2px 6px; border-radius: 6px;

  .pin.open { z-index: 3; }
  .pin.open .bub { display: block; }
  .hint { font-size: 12px; color: var(--sub); margin: 6px 2px 14px; }

  section { margin-top: 18px; }
  h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }

  footer { text-align: center; font-size: 11px; color: var(--sub); margin-top: 30px; }

const state = { page: PAGES[0].id, cat: "all" };
try { Object.assign(state, JSON.parse(localStorage.getItem("view-america") || "{}")); } catch (e) {}
if (!PAGES.some(p => p.id === state.page)) state.page = PAGES[0].id;

const $ = s => document.querySelector(s);
const page = () => PAGES.find(p => p.id === state.page);
const visible = p => p.items.map((it, i) => ({ ...it, k: `${p.id}/${i}` }))
  .filter(it => state.cat === "all" || it.cat === state.cat);
let countries = null;

function save() { try { localStorage.setItem("view-america", JSON.stringify(state)); } catch (e) {} }

function buildMap(p, items) {
  const [[x0, y0], [x1, y1]] = p.proj.extent;
  const frame = { type: "MultiPoint", coordinates: [] };
  for (let i = 0; i <= 10; i++) {
    const x = x0 + (x1 - x0) * i / 10, y = y0 + (y1 - y0) * i / 10;
    frame.coordinates.push([x, y0], [x, y1], [x0, y], [x1, y]);
  }
  const proj = d3[p.proj.type]();
  if (p.proj.rotate) proj.rotate(p.proj.rotate);
  if (p.proj.parallels) proj.parallels(p.proj.parallels);
  proj.fitWidth(W, frame);
  const path = d3.geoPath(proj);
  const H = Math.round(path.bounds(frame)[1][1]);
  const line = c => path({ type: "LineString", coordinates: c });
  const hl = new Set(items.filter(it => it.country).map(it => it.country));

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<path class="grat" d="${path(d3.geoGraticule().step([10, 10])())}"/>`;
  for (const f of countries.features)
    svg += `<path class="country ${hl.has(f.properties.name) ? "hl" : ""}" d="${path(f)}"/>`;
  svg += `<path class="borders" d="${path(countries.borders)}"/><path class="coast" d="${path(countries.land)}"/>`;
  for (const it of items) {
    if (!it.a) continue;
    // 頂点の向きが逆だと「それ以外の全世界」が塗られるので、面積で判定して直す
    let ring = [...it.a, it.a[0]];
    if (d3.geoArea({ type: "Polygon", coordinates: [ring] }) > 2 * Math.PI) ring = ring.reverse();
    svg += `<path class="area ${it.kind}" d="${path({ type: "Polygon", coordinates: [ring] })}"/>`;
  }
  for (const [lat] of p.redLat || [])
    svg += `<path class="meridian solid" d="${line(d3.range(-180, 181, 2).map(x => [x, lat]))}"/>`;
  for (const it of items) {
    if (it.m) svg += `<path class="mline" d="${line(it.m)}"/>`;
    if (it.r) svg += `<path class="river" d="${line(it.r)}"/>`;
    if (it.c) svg += `<path class="current" d="${line(it.c)}" marker-end="url(#arrow)"/>`;
    if (it.lon != null) svg += `<path class="meridian" d="${line(d3.range(-80, 81, 2).map(y => [it.lon, y]))}"/>`;
    if (it.lat != null) svg += `<path class="meridian" d="${line(d3.range(-180, 181, 2).map(x => [x, it.lat]))}"/>`;
    if (it.cat === "city") { const [cx, cy] = proj(it.at); svg += `<circle class="city" cx="${cx}" cy="${cy}" r="5"/>`; }
  }
  svg += `<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#e0453a"/></marker></defs></svg>`;

  const pct = ([lon, lat]) => { const [x, y] = proj([lon, lat]); return `left:${x / W * 100}%;top:${y / H * 100}%`; };
  const redLabels = (p.redLat || []).map(([lat, name]) => [name, p.proj.extent[0][0] + 4, lat + 1.6]);
  let overlay = redLabels.map(([name, lon, lat]) =>
    `<span class="ctx red" style="${pct([lon, lat])}">${name}</span>`).join("") + p.ctx.map(([name, lon, lat, sea]) =>
    `<span class="ctx ${sea ? "sea" : ""}" style="${pct([lon, lat])}">${name}</span>`).join("");
  for (const it of items) {
    if (!it.at) continue;
    overlay += `<button class="pin ${it.cat}" data-k="${it.k}" aria-label="${it.key}" style="${pct(it.at)}">
      <span class="mk">${it.key}</span><span class="bub">${it.ans}</span></button>`;
  }
  return `<div class="map">${svg}${overlay}</div>`;
}

function render() {
  const p = page();
  const cats = ["all", ...Object.keys(CATS).filter(c => p.items.some(it => it.cat === c))];
  if (!cats.includes(state.cat)) state.cat = "all";

  $("#tabs").innerHTML = PAGES.map(q =>
    `<button class="tab ${q.id === state.page ? "on" : ""}" data-page="${q.id}">${q.title}</button>`).join("");
  $("#cats").innerHTML = cats.map(c => `<button class="cat ${c === state.cat ? "on" : ""}" data-cat="${c}">${
    c === "all" ? "すべて" : `<i style="background:${CATS[c].color};border:1px solid #888"></i>${CATS[c].name}`}</button>`).join("");

  const items = visible(p);
  let lists = "";
  for (const c of cats.slice(1)) {
    const g = items.filter(it => it.cat === c);
    if (!g.length) continue;
    lists += `<section><h2>${CATS[c].name}<small>${g.length}問</small></h2><div class="grid">`;
    for (const it of g) {
      if (it.q) lists += `<div class="q">${it.q}</div>`;
      lists += `<div class="row" data-k="${it.k}"><span class="key">${it.key}</span>
        <span class="ans">${it.ans}<span class="cover">タップで表示</span></span></div>`;
    }
    lists += `</div></section>`;
  }
  $("#main").innerHTML = `${buildMap(p, items)}<p class="hint">地図上の記号をタップすると答えが出ます</p>${lists}`;
  sync();
}

function sync() {
  document.querySelectorAll("[data-k]").forEach(el => el.classList.toggle("open", open.has(el.dataset.k)));
  const ks = visible(page()).map(it => it.k);
  $("#count").textContent = `表示中 ${ks.filter(k => open.has(k)).length} / ${ks.length}`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-page],[data-cat]");
  if (t) {
    if (t.dataset.page) { state.page = t.dataset.page; state.cat = "all"; window.scrollTo(0, 0); }
    else state.cat = t.dataset.cat;
    save(); render(); return;
  }
  const el = e.target.closest("[data-k]");
  if (el) { const k = el.dataset.k; open.has(k) ? open.delete(k) : open.add(k); sync(); }
});
$("#hideAll").onclick = () => { visible(page()).forEach(it => open.delete(it.k)); sync(); };
$("#showAll").onclick = () => { visible(page()).forEach(it => open.add(it.k)); sync(); };

fetch("vendor/countries-50m.json").then(r => r.json()).then(world => {
  const o = world.objects.countries;
  countries = {
    features: topojson.feature(world, o).features,
    borders: topojson.mesh(world, o, (a, b) => a !== b),
    land: topojson.merge(world, o.geometries),
  };
  render();
});
</script>
</body>
</html>
